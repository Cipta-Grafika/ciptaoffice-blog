name: Continuous Deployment Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Cegah dua deploy berjalan bersamaan jika ada push beruntun
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS (ciptaoffice-blog)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            # Hentikan eksekusi script jika ada perintah yang error
            set -e

            APP_DIR=/var/www/ciptaoffice-blog
            PHP=/usr/bin/php8.3
            COMPOSER="$(command -v composer)"

            echo "Memulai proses deployment ke server..."
            cd "$APP_DIR"

            # Perbaiki error Git "dubious ownership"
            git config --global --add safe.directory "$APP_DIR"

            # 0. Mode maintenance selama deploy
            $PHP artisan down --retry=60 || true

            # Pastikan aplikasi kembali online walaupun deploy gagal di tengah jalan
            trap '$PHP artisan up || true' EXIT

            # 1. Tarik pembaruan kode terbaru dari branch master
            # Catatan: reset --hard tidak menghapus file untracked (upload di storage/app/public aman),
            # tetapi akan MENIMPA perubahan kode yang diedit langsung di VPS.
            echo "Pulling latest code from master..."
            git checkout master
            git fetch origin master
            git reset --hard origin/master

            # 2. Install dependensi PHP (Composer) secara eksplisit dengan PHP 8.3
            echo "Installing composer dependencies..."
            COMPOSER_ALLOW_SUPERUSER=1 $PHP "$COMPOSER" install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # 3. Setup NVM & build aset frontend (hanya jika project memakai npm/Vite)
            if [ -f package.json ]; then
              echo "Installing npm dependencies & building assets..."
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              export PATH=$PATH:/usr/local/bin:/usr/bin

              if [ -f package-lock.json ]; then npm ci --include=dev; else npm install; fi
              npm run build
            fi

            # 4. Jalankan migrasi database
            # --force hanya melewati konfirmasi "Are you sure?" di production, TIDAK me-reset database.
            echo "Running database migrations..."
            $PHP artisan migrate --force --no-interaction

            # 5. Pastikan symlink storage tersedia & bangun ulang cache Laravel
            echo "Ensuring storage link & optimizing Laravel cache..."
            test -L public/storage || $PHP artisan storage:link
            $PHP artisan optimize:clear
            $PHP artisan optimize

            # 6. Kembalikan permission (artisan dijalankan sebagai root, runtime harus bisa ditulis www-data)
            echo "Fixing permissions..."
            mkdir -p storage/app/public bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache
            find storage bootstrap/cache -type d -exec chmod 2775 {} \;
            find storage bootstrap/cache -type f -exec chmod 664 {} \;

            # 7. Clear PHP OPcache (hanya PHP 8.3 — jangan reload versi lain seperti php8.2-fpm)
            echo "Reloading PHP-FPM 8.3 to clear OPcache..."
            systemctl reload php8.3-fpm

            # 8. Queue worker (aktifkan jika nanti project memakai queue job)
            # $PHP artisan queue:restart || true

            # 9. Keluar dari mode maintenance (juga dijamin oleh trap EXIT di atas)
            $PHP artisan up
            trap - EXIT

            echo "Deployment completed successfully!"

